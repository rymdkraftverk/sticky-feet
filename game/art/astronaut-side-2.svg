      <rect id="torso" x="10" y="20" width="17" height="13" rx="6"/>
      <rect id="arm" x="20" y="22" width="6" height="11" rx="3" transform="rotate(15 23 23)"/>
      <circle id="helmet" cx="19" cy="12" r="10"/>
